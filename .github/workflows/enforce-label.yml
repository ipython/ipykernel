name: Enforce PR label

concurrency:
  group: label-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]
jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@925e40fa6066f4533e0c40803bd4b6d0d2f4a781 # v1.1.0
