name: Enforce PR label

concurrency:
  group: label-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize]
jobs:
  enforce-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: enforce-triage-label
        uses: jupyterlab/maintainer-tools/.github/actions/enforce-label@4016d4e69656e13e662d629ee3c30dc31e68628f # v1.1.1
